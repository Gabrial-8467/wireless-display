[workspace]
resolver = "2"
members = ["crates/wd-protocol", "crates/wd-receiver", "crates/wd-phone-core", "tools/mock-phone"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
anyhow = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
spake2 = "0.4"
postcard = { version = "1", features = ["alloc"] }
mdns-sd = "0.21"
rand = "0.10"
sha2 = "0.11"
hex = "0.4"

[profile.release]
lto = "thin"
strip = "symbols"

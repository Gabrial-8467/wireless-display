[package]
name = "wd-phone-core"
description = "Wireless Display phone-side protocol + media core (JNI library for Android)"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wd-protocol = { path = "../wd-protocol", features = ["async"] }
anyhow.workspace = true
bytes = "1"
quinn.workspace = true
rustls.workspace = true
spake2.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
jni = "0.21"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

[package.metadata.notes]
media = "video-only v1: AudioOffer declared but silent"
